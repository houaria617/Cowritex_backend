[tool.poetry]
name = "cowritex"
version = "0.1.0"
description = "Human-in-the-loop AI research writing assistant"
authors = ["Cowritex team"]
package-mode = false  

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2"
langchain-core = "^0.2"
langchain-groq = "^0.1"
langchain-google-genai = "^1.0"
supabase = "^2.0"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
python-dotenv = "^1.0"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"